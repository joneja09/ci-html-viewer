name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install extension dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Install task dependencies
        run: npm ci
        working-directory: tasks/UploadPortalHtmlReport
      - name: Test upload task
        run: npm test
        working-directory: tasks/UploadPortalHtmlReport

      - name: Test GitHub Action helpers
        run: node --test github-action/*.test.js

  publish-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish fixture HTML reports
        uses: ./
        with:
          report-dir: tasks/UploadPortalHtmlReport/tests/fixtures
          name: Fixture Reports
          fail-on-failed-reports: false
          comment-on-pr: true
